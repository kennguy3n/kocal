[package]
name = "kchat-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM bindings for KChat AI Runtime (deterministic safety plane)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kchat-safety = { path = "../kchat-safety", default-features = false }
kchat-core = { path = "../kchat-core" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Override uuid with js feature for WASM
uuid = { version = "1.10", features = ["v4", "serde", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
