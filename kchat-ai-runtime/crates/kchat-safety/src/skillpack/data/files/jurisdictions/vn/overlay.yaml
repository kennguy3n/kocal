# kchat.jurisdiction.vn.guardrail.v1
#
# Vietnam jurisdiction overlay — country pack.
# Layered on top of kchat.global.guardrail.baseline.
# Concrete values below reflect the primary legal framework summarised as:
#   Law on Children 2016; Anti-Terrorism Law 2013.
# Legal and cultural reviewers are named in ``signers``; overlays
# inherit the privacy-contract rule against embedded harm strings,
# so everything below is catalogue-only.

skill_id: kchat.jurisdiction.vn.guardrail.v1
parent: kchat.global.guardrail.baseline
schema_version: 1
# ~18 months from 2026-04-29 — the maximum permitted by the compiler.
expires_on: "2027-10-29"
signers: [trust_and_safety, legal_review, cultural_review]

# --------------------------------------------------------------------------
# Activation
# --------------------------------------------------------------------------
activation:
  criteria:
    - user_selected_region: vn
    - group_declared_jurisdiction: vn
    - app_store_install_region: vn
    - enterprise_managed_policy: vn
  forbidden_criteria:
    - gps_location
    - ip_geolocation
    - inferred_nationality
    - inferred_ethnicity
    - inferred_religion

# --------------------------------------------------------------------------
# Local definitions
# --------------------------------------------------------------------------
local_definitions:
  legal_age_general: 18
  legal_age_sexual_content_consumer: 18
  legal_age_marketplace_alcohol: 18
  legal_age_marketplace_tobacco: 18
  # Protected-class enumeration from Hiến pháp 2013 Art. 16.
  protected_classes:
    - ethnic_origin
    - religion
    - belief
    - sex
    - age
    - disability
    - social_origin
    - place_of_origin
    - language
    - political_view
  listed_extremist_orgs:
    - vn_listed_extremist_orgs_v1
  restricted_symbols:
    - vn_restricted_symbols_catalogue_v1
  election_rules:
    civic_window_open:  "2026-03-15"
    civic_window_close: "2026-05-31"
    authority_resource_id: vn_nec_authority_v1

# --------------------------------------------------------------------------
# Local language assets
# --------------------------------------------------------------------------
local_language_assets:
  primary_languages: [vi]
  lexicons:
    - lexicon_id: vn_vi_lexicon_v1
      language: vi
      categories: [1, 4]
      provenance: kchat_trust_and_safety_vn_v1
  normalization:
    nfkc: true
    case_fold: true
    homoglyph_map_id: homoglyph_core_v1
    transliteration_refs: [translit_core_v1]

# --------------------------------------------------------------------------
# Overrides
# --------------------------------------------------------------------------
overrides:
  - category: 1   # CHILD_SAFETY
    severity_floor: 5
    note: >-
      Luật Trẻ em 2016 — Law on Children. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.
  - category: 4   # EXTREMISM
    severity_floor: 4
    note: >-
      Luật Phòng, chống khủng bố 2013 — Anti-Terrorism Law. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.
  - category: 7   # SCAM_FRAUD
    severity_floor: 3
    note: >-
      Vietnam consumer protection and anti-fraud framework. Raise
      severity for impersonation of government agencies, police, or
      bank officials.
  - category: 2   # SELF_HARM
    severity_floor: 3
    note: >-
      Law on Mental Health 2015 (Luật Sức khỏe tâm thần). Self-harm
      content is raised to the warn floor to ensure crisis resources
      surface.
  - category: 3   # VIOLENCE_THREAT
    severity_floor: 3
    note: >-
      Penal Code 2015 (Bộ luật Hình sự) articles 133–134 (threats,
      intimidation). Credible threats are raised to the warn floor.
  - category: 5   # HARASSMENT
    severity_floor: 2
    note: >-
      Penal Code 2015 article 133 (harassment via telecommunications).
      Harassment is raised to the caution floor.
  - category: 6   # HATE
    severity_floor: 3
    note: >-
      Penal Code 2015 articles 293–295 (discrimination, incitement
      to hatred). Hate speech targeting protected classes is raised
      to the warn floor.
  - category: 8   # MALWARE_LINK
    severity_floor: 3
    note: >-
      Law on Cybersecurity 2018 (Luật An ninh mạng). Malware
      distribution and credential-harvesting links are raised to
      the warn floor.
  - category: 11  # DRUGS_WEAPONS
    severity_floor: 4
    note: >-
      Penal Code 2015 articles 247–257 (drug offences) and Law on
      Management of Weapons 2017. Sale or facilitation of controlled
      drugs and weapons is raised to the strong-warn floor.
  - category: 13  # MISINFORMATION_HEALTH
    severity_floor: 2
    note: >-
      Law on Pharmacy 2016 and MOH guidance. Health misinformation
      contradicting public-health consensus is raised to the caution
      floor.
  - category: 14  # MISINFORMATION_CIVIC
    severity_floor: 3
    note: >-
      Law on Cybersecurity 2018 and Penal Code article 331. Civic
      misinformation is raised to the warn floor.
  - category: 16  # DEEPFAKE_SYNTHETIC
    severity_floor: 3
    note: >-
      Law on Cybersecurity 2018. Synthetic media intended to deceive
      is raised to the warn floor; during the civic window, the
      baseline escalation to severity 5 applies.

slm_prompt_suffix: >-
  Vietnam jurisdiction: apply consumer-fraud awareness for common
  Vietnamese scam patterns. Watch for fake delivery SMS (bưu điện
  phí), bank impersonation (Cảnh sát điều tra), government
  impersonation (công an, thuế), crypto investment pig-butchering
  (giết lợn), and fake lottery/prize scams (trúng thưởng). Vietnamese
  and English scam patterns are in scope.

scam_phrase_additions:
  - key: vi_vn_scam
    language: vi
    entries:
      - phrase: cảnh sát điều tra
        weight: 0.9
      - phrase: tài khoản bị khóa
        weight: 0.85
      - phrase: bưu điện phí thuế
        weight: 0.85
      - phrase: trúng thưởng số điện thoại
        weight: 0.9
      - phrase: đầu tư crypto đảm bảo
        weight: 0.85
      - phrase: công an yêu cầu chuyển khoản
        weight: 0.9
      - phrase: hoàn thuế Viettel
        weight: 0.8
      - phrase: vay tiền không thế chấp
        weight: 0.8
  - key: en_vn_scam
    language: en
    entries:
      - phrase: Vietnam police investigation
        weight: 0.9
      - phrase: bank account frozen Vietnam
        weight: 0.85
      - phrase: customs fee Vietnam package
        weight: 0.8
      - phrase: Viettel tax refund
        weight: 0.8

# --------------------------------------------------------------------------
# Allowed contexts — preserve all four protected-speech carve-outs.
# --------------------------------------------------------------------------
allowed_contexts:
  - QUOTED_SPEECH_CONTEXT
  - NEWS_CONTEXT
  - EDUCATION_CONTEXT
  - COUNTERSPEECH_CONTEXT

# --------------------------------------------------------------------------
# User notice
# --------------------------------------------------------------------------
user_notice:
  visible_pack_summary: >-
    Vietnam safety pack. Raises floors on child protection (Luật Trẻ em 2016) and anti-terrorism (Luật 2013). Protected speech remains permitted.
  appeal_resource_id: vn_appeal_resource_v1
  opt_out_allowed: false
