[package]
name = "kchat-generation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
llamacpp = ["dep:llama-cpp-2"]
llamacpp-metal = ["llamacpp", "llama-cpp-2/metal", "llama-cpp-2/common"]
llamacpp-vulkan = ["llamacpp", "llama-cpp-2/vulkan", "llama-cpp-2/common"]
llamacpp-cuda = ["llamacpp", "llama-cpp-2/cuda", "llama-cpp-2/common"]
mlx = ["dep:reqwest", "dep:which"]
litert = []

[dependencies]
kchat-core = { path = "../kchat-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
regex = "1"

# Optional llama.cpp backend — feature flags select the GPU backend
# (metal on macOS/iOS, vulkan on Android/Windows, cuda on Linux, or plain CPU)
# The `common` feature enables grammar-constrained sampling (GBNF).
llama-cpp-2 = { version = "0.1", default-features = false, optional = true }

# Optional MLX backend — spawns the Swift kchat-mlx-server subprocess and
# proxies its HTTP API. Uses a local reqwest dep with the `blocking` feature
# (the workspace reqwest is async-only).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
which = { version = "7", optional = true }

[dev-dependencies]
tempfile = "3"
