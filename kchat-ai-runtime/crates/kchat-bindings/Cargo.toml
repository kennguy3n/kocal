[package]
name = "kchat-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib produces the loadable artifacts (.node for N-API, shared lib for
# UniFFI); rlib keeps the crate usable as a normal Rust dependency.
crate-type = ["rlib", "cdylib"]

[features]
default = []
mobile = ["dep:uniffi", "dep:uniffi_build"]
mobile-full = ["mobile", "gguf-encoder", "llamacpp", "kchat-context/gguf-embeddings"]
desktop = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# Real in-process GGUF encoder (mmBERT via llama.cpp) shared across safety
# classification, embeddings, and reranking.
gguf-encoder = [
    "dep:kchat-encoder",
    "kchat-encoder/gguf-runtime",
    "kchat-safety/gguf-encoder",
    "kchat-context/gguf-embeddings",
]
# In-process llama.cpp generation backend (feature-select GPU variant via
# kchat-generation/llamacpp-{metal,vulkan,cuda} on the consuming crate).
llamacpp = ["kchat-generation/llamacpp"]

[dependencies]
kchat-core = { path = "../kchat-core" }
kchat-safety = { path = "../kchat-safety" }
kchat-context = { path = "../kchat-context" }
kchat-generation = { path = "../kchat-generation" }
kchat-action = { path = "../kchat-action" }
kchat-runtime = { path = "../kchat-runtime" }
kchat-image = { path = "../kchat-image" }
kchat-encoder = { path = "../kchat-encoder", optional = true }
uuid = { workspace = true }
hex = "0.4"
blake3 = "1"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

# UniFFI for mobile
uniffi = { version = "0.28", default-features = false, optional = true }

# N-API for desktop
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
uniffi_build = { version = "0.28", features = ["builtin-bindgen"], optional = true }
napi-build = { version = "2", optional = true }
