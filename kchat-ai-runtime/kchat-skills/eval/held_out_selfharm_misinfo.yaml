$schema: "kchat.guardrail.eval_case.v1"
# Held-out SELF_HARM + MISINFO deterministic slice (Stream I).
#
# Two roles, mirroring the other held-out slices:
#   * adversarial            — explicit, unambiguous harmful instances
#                              that the deterministic phrase banks MUST
#                              catch (reason_codes include LEXICON_HIT).
#   * benign_false_positive  — realistic look-alikes from the genres that
#                              dominate these topics (clinical / support /
#                              recovery, news, fact-check / quote-to-debunk,
#                              pro-health and civic-info messaging). The
#                              pipeline must NOT flag any of these
#                              (category 0, no LEXICON_HIT).
#
# Languages / scripts: en, es, pt, fr, de, ar, ja, zh, hi + code-switched /
# transliterated ru (Cyrillic), el (Greek), vi (diacritics), ar (Arabizi),
# hi (Hinglish). Native-script harmful tokens live in
# ``default_lexicons.yaml``; folded/romanized tokens live in
# ``codeswitch_selfharm_misinfo_lexicons.yaml`` and only fire once the
# translit_core_v1 fold is enabled.
#
# Precision rationale (proven by the benign cases below):
#   * SELF_HARM tokens are second-person encouragement or first-person
#     RESOLVED intent. Support / recovery / education text uses gerund or
#     third-person framing ("thoughts of ending your life", "warning signs
#     of self-harm") which does NOT contain the imperative / resolved form.
#   * MISINFO tokens are harmful ACTION-DIRECTIVES ("don't vaccinate your
#     children"), never bare claims. Fact-checks reproduce the bare claim
#     ("vaccines cause autism") to refute it, but not the directive.
#
# No real PII, no live URLs. Harm text is paraphrased / hand-authored.
cases:
  # =====================================================================
  # SELF_HARM — adversarial (must fire, category 2)
  # =====================================================================
  - case_id: sh_en_first_person_intent_001
    language: en
    description: English first-person resolved suicidal intent with timeline.
    message:
      text: "i'm going to kill myself tonight, i can't do this"
    context: &ctx_default
      group_kind: large_room
      group_age_mode: adult_only
      user_role: member
      relationship_known: false
      locale: en-US
      jurisdiction_id: null
      community_overlay_id: null
      is_offline: false
    expected:
      category: 2
      severity_at_least: 3
      reason_codes_must_include: [LEXICON_HIT]
    tags: [adversarial, self_harm, en]

  - case_id: sh_en_encouragement_001
    language: en
    description: English second-person suicide-bait.
    message:
      text: "nobody likes you, go kill yourself"
    context: *ctx_default
    expected:
      category: 2
      severity_at_least: 3
      reason_codes_must_include: [LEXICON_HIT]
    tags: [adversarial, self_harm, en]

  - case_id: sh_en_note_001
