# Held-out VISION evaluation set — kchat.guardrail.eval_case.v1
#
# Generated by tools/gen_vision_corpus.py. Parallel to
# held_out_benign.yaml / held_out_adversarial.yaml but for the
# vision modality: every case carries a media_descriptor
# (nsfw_score / violence_score / face_count) that drives the
# on-device vision signal, plus locale / jurisdiction / community
# context. No real PII, no CSAM-adjacent text, no live URLs.
#
# Coverage: 16 taxonomy categories, all 38 community overlays
# (>= 2 cases each), 20 jurisdictions, image + video modalities,
# and all three age modes (minor_present / mixed_age / adult_only).
$schema: "kchat.guardrail.eval_case.v1"
