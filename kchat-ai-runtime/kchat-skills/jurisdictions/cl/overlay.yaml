# kchat.jurisdiction.cl.guardrail.v1
#
# Chile jurisdiction overlay — country pack.
# Layered on top of kchat.global.guardrail.baseline.
# Concrete values below reflect the primary legal framework summarised as:
#   Ley 21.057 child protection; Ley Antiterrorista (Ley 18.314).
# Legal and cultural reviewers are named in ``signers``; overlays
# inherit the privacy-contract rule against embedded harm strings,
# so everything below is catalogue-only.

skill_id: kchat.jurisdiction.cl.guardrail.v1
parent: kchat.global.guardrail.baseline
schema_version: 1
# ~18 months from 2026-04-29 — the maximum permitted by the compiler.
expires_on: "2027-10-29"
signers: [trust_and_safety, legal_review, cultural_review]

# --------------------------------------------------------------------------
# Activation
# --------------------------------------------------------------------------
activation:
  criteria:
    - user_selected_region: cl
    - group_declared_jurisdiction: cl
    - app_store_install_region: cl
    - enterprise_managed_policy: cl
  forbidden_criteria:
    - gps_location
    - ip_geolocation
    - inferred_nationality
    - inferred_ethnicity
    - inferred_religion

# --------------------------------------------------------------------------
# Local definitions
# --------------------------------------------------------------------------
local_definitions:
  legal_age_general: 18
  legal_age_sexual_content_consumer: 18
  legal_age_marketplace_alcohol: 18
  legal_age_marketplace_tobacco: 18
  # Protected-class enumeration from Ley 20.609 — Zamudio anti-discrimination law.
  protected_classes:
    - race
    - ethnic_origin
    - nationality
    - religion
    - ideology
    - political_opinion
    - sex
    - gender_identity
    - sexual_orientation
    - marital_status
    - age
    - disability
    - language
    - socioeconomic_status
  listed_extremist_orgs:
    - cl_listed_extremist_orgs_v1
  restricted_symbols:
    - cl_restricted_symbols_catalogue_v1
  election_rules:
    civic_window_open:  "2027-09-15"
    civic_window_close: "2027-12-15"
    authority_resource_id: cl_servel_authority_v1

# --------------------------------------------------------------------------
# Local language assets
# --------------------------------------------------------------------------
local_language_assets:
  primary_languages: [es]
  lexicons:
    - lexicon_id: cl_es_lexicon_v1
      language: es
      categories: [1, 4]
      provenance: kchat_trust_and_safety_cl_v1
  normalization:
    nfkc: true
    case_fold: true
    homoglyph_map_id: homoglyph_core_v1
    transliteration_refs: [translit_core_v1]

# --------------------------------------------------------------------------
# Overrides
# --------------------------------------------------------------------------
overrides:
  - category: 1   # CHILD_SAFETY
    severity_floor: 5
    note: >-
      Ley 21.057 entrevista videograbada para víctimas niñas, niños y adolescentes. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.
  - category: 4   # EXTREMISM
    severity_floor: 4
    note: >-
      Ley 18.314 conductas terroristas. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.

# --------------------------------------------------------------------------
# Allowed contexts — preserve all four protected-speech carve-outs.
# --------------------------------------------------------------------------
allowed_contexts:
  - QUOTED_SPEECH_CONTEXT
  - NEWS_CONTEXT
  - EDUCATION_CONTEXT
  - COUNTERSPEECH_CONTEXT

# --------------------------------------------------------------------------
# User notice
# --------------------------------------------------------------------------
user_notice:
  visible_pack_summary: >-
    Chile safety pack. Raises floors on child protection (Ley 21.057) and anti-terrorism provisions (Ley 18.314). Protected speech remains permitted.
  appeal_resource_id: cl_appeal_resource_v1
  opt_out_allowed: true
