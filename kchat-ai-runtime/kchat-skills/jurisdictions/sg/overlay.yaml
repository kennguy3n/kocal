# kchat.jurisdiction.sg.guardrail.v1
#
# Singapore jurisdiction overlay — country pack.
# Layered on top of kchat.global.guardrail.baseline.
# Concrete values below reflect the primary legal framework summarised as:
#   Children and Young Persons Act; Internal Security Act; Online Safety Acts.
# Legal and cultural reviewers are named in ``signers``; overlays
# inherit the privacy-contract rule against embedded harm strings,
# so everything below is catalogue-only.

skill_id: kchat.jurisdiction.sg.guardrail.v1
parent: kchat.global.guardrail.baseline
schema_version: 1
# ~18 months from 2026-04-29 — the maximum permitted by the compiler.
expires_on: "2027-10-29"
signers: [trust_and_safety, legal_review, cultural_review]

# --------------------------------------------------------------------------
# Activation
# --------------------------------------------------------------------------
activation:
  criteria:
    - user_selected_region: sg
    - group_declared_jurisdiction: sg
    - app_store_install_region: sg
    - enterprise_managed_policy: sg
  forbidden_criteria:
    - gps_location
    - ip_geolocation
    - inferred_nationality
    - inferred_ethnicity
    - inferred_religion

# --------------------------------------------------------------------------
# Local definitions
# --------------------------------------------------------------------------
local_definitions:
  legal_age_general: 18
  legal_age_sexual_content_consumer: 18
  legal_age_marketplace_alcohol: 18
  legal_age_marketplace_tobacco: 21
  # Protected-class enumeration from Constitution Art. 12 + Maintenance of Religious Harmony Act.
  protected_classes:
    - race
    - religion
    - language
    - descent
    - place_of_birth
    - sex
    - age
    - disability
    - sexual_orientation
    - gender_identity
  listed_extremist_orgs:
    - sg_listed_extremist_orgs_v1
  restricted_symbols:
    - sg_restricted_symbols_catalogue_v1
  election_rules:
    civic_window_open:  "2030-06-15"
    civic_window_close: "2030-12-15"
    authority_resource_id: sg_eld_authority_v1

# --------------------------------------------------------------------------
# Local language assets
# --------------------------------------------------------------------------
local_language_assets:
  primary_languages: [en, zh, ms, ta]
  lexicons:
    - lexicon_id: sg_en_lexicon_v1
      language: en
      categories: [1, 4]
      provenance: kchat_trust_and_safety_sg_v1
    - lexicon_id: sg_zh_lexicon_v1
      language: zh
      categories: [1, 4]
      provenance: kchat_trust_and_safety_sg_v1
    - lexicon_id: sg_ms_lexicon_v1
      language: ms
      categories: [1, 4]
      provenance: kchat_trust_and_safety_sg_v1
    - lexicon_id: sg_ta_lexicon_v1
      language: ta
      categories: [1, 4]
      provenance: kchat_trust_and_safety_sg_v1
  normalization:
    nfkc: true
    case_fold: true
    homoglyph_map_id: homoglyph_core_v1
    transliteration_refs: [translit_core_v1, translit_cjk_v1]

# --------------------------------------------------------------------------
# Overrides
# --------------------------------------------------------------------------
overrides:
  - category: 1   # CHILD_SAFETY
    severity_floor: 5
    note: >-
      Children and Young Persons Act 1993; Online Criminal Harms Act 2023. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.
  - category: 4   # EXTREMISM
    severity_floor: 4
    note: >-
      Internal Security Act — offences against the State. Protected-speech contexts (quoted speech, news, education, counterspeech) remain permitted.
  - category: 2   # SELF_HARM
    severity_floor: 3
    note: >-
      Mental Health Care Act 2008. Self-harm content is raised to
      the warn floor to ensure crisis resources surface.
  - category: 3   # VIOLENCE_THREAT
    severity_floor: 3
    note: >-
      Penal Code 1871 sections 503–507 (criminal intimidation,
      extortion). Credible threats are raised to the warn floor.
  - category: 5   # HARASSMENT
    severity_floor: 3
    note: >-
      Protection from Harassment Act 2014 (POHA). Harassment is
      raised to the warn floor at the jurisdiction layer.
  - category: 6   # HATE
    severity_floor: 3
    note: >-
      Penal Code 1871 section 298 (uttering words with intent to
      wound religious feelings) and Maintenance of Religious
      Harmony Act 1990. Hate speech targeting protected classes is
      raised to the warn floor.
  - category: 7   # SCAM_FRAUD
    severity_floor: 4
    note: >-
      Online Criminal Harms Act 2023 and Penal Code sections 415–420
      (cheating). Scam and fraud content is raised to the strong-warn
      floor.
  - category: 8   # MALWARE_LINK
    severity_floor: 3
    note: >-
      Computer Misuse Act 1993. Malware distribution and credential-
      harvesting links are raised to the warn floor.
  - category: 11  # DRUGS_WEAPONS
    severity_floor: 4
    note: >-
      Misuse of Drugs Act and Arms Offences Act. Sale or facilitation
      of controlled drugs and firearms is raised to the strong-warn
      floor.
  - category: 13  # MISINFORMATION_HEALTH
    severity_floor: 2
    note: >-
      Health Products Act 2007 and MOH guidance. Health
      misinformation contradicting public-health consensus is raised
      to the caution floor.
  - category: 14  # MISINFORMATION_CIVIC
    severity_floor: 3
    note: >-
      Parliamentary Elections Act and Protection from Online
      Falsehoods and Manipulation Act 2019 (POFMA). Civic
      misinformation is raised to the warn floor.
  - category: 16  # DEEPFAKE_SYNTHETIC
    severity_floor: 3
    note: >-
      POFMA and Online Criminal Harms Act. Synthetic media intended
      to deceive is raised to the warn floor; during the civic
      window, the baseline escalation to severity 5 applies.

slm_prompt_suffix: >-
  Singapore jurisdiction: apply Online Criminal Harms Act awareness.
  Watch for China Police impersonation scams, fake MOM/IHA/IRAS
  official notices, e-commerce scam listings, banking-phishing SMS,
  and crypto investment pig-butchering lures. English, Chinese,
  Malay, and Tamil scam patterns are in scope. Raise severity for
  impersonation of government agencies or law enforcement.

scam_phrase_additions:
  - key: en_sg_scam
    language: en
    entries:
      - phrase: Singapore Police Force investigation
        weight: 0.9
      - phrase: IRAS tax refund verification
        weight: 0.85
      - phrase: MOM work permit fee
        weight: 0.85
      - phrase: bank account frozen Singapore
        weight: 0.8
      - phrase: Shopee Lazada scam listing
        weight: 0.75
      - phrase: crypto investment guaranteed Singapore
        weight: 0.85
  - key: zh_sg_scam
    language: zh
    entries:
      - phrase: 中国警察调查
        weight: 0.9
      - phrase: 银行账户冻结
        weight: 0.85
      - phrase: 投资理财保证收益
        weight: 0.85
      - phrase: 包裹待领取费用
        weight: 0.8
      - phrase: 新加坡税务局退税
        weight: 0.85
  - key: ms_sg_scam
    language: ms
    entries:
      - phrase: polis Singapura siasatan
        weight: 0.9
      - phrase: bayaran permit kerja MOM
        weight: 0.85
      - phrase: pelaburan crypto jaminan
        weight: 0.85
  - key: ta_sg_scam
    language: ta
    entries:
      - phrase: சிங்கப்பூர் காவல்துறை விசாரணை
        weight: 0.9
      - phrase: வங்கி கணக்கு முடக்கப்பட்டது
        weight: 0.85

# --------------------------------------------------------------------------
# Allowed contexts — preserve all four protected-speech carve-outs.
# --------------------------------------------------------------------------
allowed_contexts:
  - QUOTED_SPEECH_CONTEXT
  - NEWS_CONTEXT
  - EDUCATION_CONTEXT
  - COUNTERSPEECH_CONTEXT

# --------------------------------------------------------------------------
# User notice
# --------------------------------------------------------------------------
user_notice:
  visible_pack_summary: >-
    Singapore safety pack. Raises floors on child protection (CYPA) and internal-security offences (ISA). Protected speech remains permitted.
  appeal_resource_id: sg_appeal_resource_v1
  opt_out_allowed: false
