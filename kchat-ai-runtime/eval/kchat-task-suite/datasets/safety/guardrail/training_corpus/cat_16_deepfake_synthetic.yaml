# Training corpus subset — category 16 (deepfake_synthetic).
# Loaded by build-tools/compiler/training_data.py at module
# import time and concatenated with the other cat_*.yaml files
# to form ``TRAINING_EXAMPLES``.
#
# See compiler/training_data.py for the loader, the SAFE-class
# over-sampling rationale, and the per-category coverage
# constraints (multilingual paraphrases, adversarial variants,
# near-boundary cases).
#
# Scope: deepfake face-swap, synthetic voice-to-video, AI-generated
# impersonation, and doctored/spliced media designed to deceive.
# Examples are short descriptive labels of the *content type*, never
# instructions for producing it. Legitimate, clearly-disclosed AI art
# is intentionally excluded here and lives in the SAFE class so the
# head learns the deception boundary rather than "AI-generated == bad".
category_id: 16
category_name: deepfake_synthetic
examples:
