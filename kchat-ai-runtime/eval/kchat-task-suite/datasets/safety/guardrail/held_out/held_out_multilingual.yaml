$schema: "kchat.guardrail.text_recall_eval.v1"
# Held-out MULTILINGUAL text-recall eval for the XLM-R classification head.
#
# Purpose
# -------
# Measures the *encoder head* in isolation (XLMRAdapter.classify over the real
# ONNX encoder) — per-category recall, per-language accuracy, and benign
# false-positive rate. This is the metric source for the before/after numbers
# in the Stream-B PR. It is intentionally NOT consumed by the CI eval_runner /
# bias_audit gates (those use the stub encoder over held_out_{benign,adversarial}.yaml);
# it is driven by tools/eval_multilingual_recall.py.
#
# Authoring contract
# ------------------
# * Every case is hand-authored and HELD OUT: distinct from both the synthetic
#   training corpus (kchat-skills/eval/training_corpus/*) and the public
#   sourced data (datasets/text/). No copying from any training source.
# * No real PII, no live URLs, no actionable instructions. Harmful cases are
#   short, paraphrased signal probes for a *defensive* safety classifier.
# * `expected.category` is the taxonomy id (kchat-skills/global/taxonomy.yaml).
#   Benign cases use category 0 (SAFE) and include hard negatives that mention
#   identity / health / politics / sadness neutrally — these MUST stay SAFE.
schema_version: 1
taxonomy_ref: kchat-skills/global/taxonomy.yaml
cases:
