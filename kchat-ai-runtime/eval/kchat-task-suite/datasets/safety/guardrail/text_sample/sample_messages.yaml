# ---------------------------------------------------------------------------
# WS2a — sample-corpus expansion (May 2026).
#
# Goals (mirroring the WS1a / WS1b discipline):
#
# * Cover every taxonomy slot 0..16 with at least one *authored-style*
#   case — pre-expansion only 4 of 16 categories had any non-zero
#   ``expected_category`` (0, 7, 9, 10), so the demo CLI's
#   ``passed`` column only ever exercised four labels. The
#   expansion fills the remaining twelve.
# * Multilingual breadth. Pre-expansion the corpus was 24 / 27 EN.
#   The expansion adds Arabic, Japanese, Hindi, Bengali, Korean,
#   Malay, French, Italian, Portuguese, and German cases — drawn
#   from the priority + focus-region languages already in the
#   training corpus (``training_data.py:24-39``).
# * Group-context breadth. Pre-expansion ``public_channel`` was
#   absent and ``minor_present`` had one case. Both are now
#   exercised by multiple cases.
# * Severity breadth. Pre-expansion only severities 0 and 3
#   appeared. Severity 1, 2, 4, and 5 now appear.
# * Privacy contract preserved — every case is synthetic. No real
#   PII (phone numbers are 555-prefix / non-routable; cards have
#   the documented test BIN; URLs use ``.click`` / ``.top`` /
#   ``.zip`` placeholder hostnames known to be safe). No
#   CSAM-adjacent text — the CHILD_SAFETY cases use the same
#   third-person descriptive framing as the training corpus
#   (``cat_01_child_safety.yaml``).
#
# Categories with detector-shape evidence (URL risk, scam keywords,
# PII regex, NSFW media descriptors) produce authored-style text
# the deterministic layer can react to. Categories that depend on
# encoder reasoning (HATE, EXTREMISM, HARASSMENT, SELF_HARM,
# VIOLENCE_THREAT, MISINFORMATION_HEALTH / _CIVIC) use descriptive
# patterns the trained XLM-R head is expected to land on. The
# demo CLI's ``passed`` column reflects deterministic agreement;
# the real-encoder column shows MLP head agreement when run with
# ``--encoder xlmr``.

# --- Cross-cutting SAFE multilingual fills (priority languages). ---

