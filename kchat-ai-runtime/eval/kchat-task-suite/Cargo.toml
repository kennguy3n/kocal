[package]
name = "kchat-task-suite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kchat-core = { path = "../../crates/kchat-core" }
kchat-safety = { path = "../../crates/kchat-safety" }
kchat-encoder = { path = "../../crates/kchat-encoder" }
kchat-context = { path = "../../crates/kchat-context" }
kchat-generation = { path = "../../crates/kchat-generation" }
kchat-action = { path = "../../crates/kchat-action" }
kchat-bindings = { path = "../../crates/kchat-bindings" }
kchat-image = { path = "../../crates/kchat-image" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
ed25519-dalek = { workspace = true }
rand = "0.8"
blake3 = "1"
rusqlite = { version = "0.36", features = ["bundled-sqlcipher-vendored-openssl"] }
which = "7"
num_cpus = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[features]
skill-pack = ["kchat-safety/skill-pack"]
onnx-runtime = ["kchat-safety/onnx-runtime", "kchat-encoder/onnx-runtime"]
onnx-runtime-vision = ["onnx-runtime", "kchat-safety/onnx-runtime-vision"]
full-pipeline = ["skill-pack", "onnx-runtime", "onnx-runtime-vision"]

[[bin]]
name = "kchat-task-suite"
path = "src/main.rs"
