[workspace]
resolver = "2"
members = [
    "crates/kchat-core",
    "crates/kchat-encoder",
    "crates/kchat-safety",
    "crates/kchat-asr",
    "crates/kchat-context",
    "crates/kchat-generation",
    "crates/kchat-action",
    "crates/kchat-image",
    "crates/kchat-bindings",
    "crates/kchat-wasm",
    "sidecars/kchat-generative-sidecar",
    "eval/kchat-task-suite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["KChat Team"]
repository = "https://github.com/kennguy3n/kchat-ai-runtime"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Cryptography and signing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Async
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "macros", "fs", "io-util", "time", "process"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# IDs
uuid = { version = "1.10", features = ["v4", "serde"] }
# Misc
once_cell = "1.19"
parking_lot = "0.12"
bytes = "1.7"
# HTTP client (image search providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
